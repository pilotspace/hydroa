# ── Production overlay — layered over values.yaml (`-f values.yaml -f values-prod.yaml`) ──
# Demonstrates env-parameterization: swaps image tag, datastore endpoints, and the
# secret reference WITHOUT editing any template. Real secrets live in the referenced
# k8s Secrets, never here.
image:
  tag: "0.14.1-prod"

# The dashboard has its OWN image block, so the gateway override above does NOT reach it.
# This override was MISSING until 0.14.0: prod fell through to values.yaml's plain tag, so a
# `-prod` gateway ran against a non-`-prod` dashboard and nobody had noticed because both
# were pinned to the same stale 0.4.0. See todo #110.
dashboard:
  image:
    tag: "0.14.1-prod"

gateway:
  replicas: 3
  env:
    databaseUrl: "postgresql+asyncpg://gateway@ai-proxy-prod-postgres.internal:5432/gateway"
    redisUrl: "redis://ai-proxy-prod-redis.internal:6379/0"
    # Invite-only in prod (Tin, 2026-07-10): the S1 signup-takeover vector is closed at deploy.
    # Bootstrap the first tenant via the documented temporary flip-on/flip-off (M6).
    publicSignupEnabled: false                                          # GATEWAY_PUBLIC_SIGNUP_ENABLED
  jwtSecret:
    existingSecret: "ai-proxy-prod-secrets"
