{{- if .Values.gateway.jwtSecret.createSecret }}
# Rendered ONLY when createSecret=true (e.g. local kind). Production references an
# externally-managed Secret via gateway.jwtSecret.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-proxy.gateway.jwtSecretName" . }}
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  {{ .Values.gateway.jwtSecret.existingKey }}: {{ required "gateway.jwtSecret.value is required when createSecret=true" .Values.gateway.jwtSecret.value | quote }}
  # Provider-credential encryption key (Fernet). NO `required`: renders "" when unset so
  # an external-Secret install (createSecret=false) is unaffected and templating never fails.
  {{ .Values.gateway.providerKeyEncryption.existingKey }}: {{ .Values.gateway.providerKeyEncryption.value | quote }}
{{- end }}
