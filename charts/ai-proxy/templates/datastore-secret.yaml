{{/* Guard runs ALWAYS (even when create=false) — chart_invalid -> datastore_secret_ref_missing. */}}
{{- include "ai-proxy.datastores.validateSecret" . -}}
{{- if .Values.datastores.secrets.create -}}
{{/* Fail-closed (F1): never render a passwordless datastore. When the chart MINTS the Secret,
     every credential it carries must be non-empty — else Postgres/MinIO would start with an
     empty password (effectively no auth). `trim` so whitespace does not pass as set. */}}
{{- if not (.Values.datastores.secrets.postgresPassword | toString | trim) -}}
{{- fail "datastore_secret_value_missing: datastores.secrets.postgresPassword must be non-empty when datastores.secrets.create=true" -}}
{{- end -}}
{{- if not (.Values.datastores.secrets.minioRootUser | toString | trim) -}}
{{- fail "datastore_secret_value_missing: datastores.secrets.minioRootUser must be non-empty when datastores.secrets.create=true" -}}
{{- end -}}
{{- if not (.Values.datastores.secrets.minioRootPassword | toString | trim) -}}
{{- fail "datastore_secret_value_missing: datastores.secrets.minioRootPassword must be non-empty when datastores.secrets.create=true" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-proxy.datastores.secretName" . }}
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: datastore-secrets
type: Opaque
stringData:
  pg-password: {{ .Values.datastores.secrets.postgresPassword | quote }}
  # The full asyncpg DSN the gateway sources via gateway.env.databaseUrlSecretRef (key: url).
  url: {{ printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.datastores.postgres.user .Values.datastores.secrets.postgresPassword (include "ai-proxy.postgres.fullname" .) .Values.datastores.postgres.database | quote }}
  minio-root-user: {{ .Values.datastores.secrets.minioRootUser | quote }}
  minio-root-password: {{ .Values.datastores.secrets.minioRootPassword | quote }}
{{- end -}}
