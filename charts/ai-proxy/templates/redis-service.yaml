{{- if .Values.datastores.redis.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-proxy.redis.fullname" . }}
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "ai-proxy.redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end -}}
