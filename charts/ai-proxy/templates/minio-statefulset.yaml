{{- if .Values.datastores.minio.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-proxy.minio.fullname" . }}
  labels:
    {{- include "ai-proxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
spec:
  serviceName: {{ include "ai-proxy.minio.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ai-proxy.minio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-proxy.minio.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.datastores.minio.podSecurityContext | nindent 8 }}
      containers:
        - name: minio
          image: {{ .Values.datastores.minio.image | quote }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.datastores.minio.consolePort }}"
          ports:
            - name: api
              containerPort: {{ .Values.datastores.minio.apiPort }}
            - name: console
              containerPort: {{ .Values.datastores.minio.consolePort }}
          env:
            # Root credentials from the datastore Secret — never literals.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-proxy.datastores.secretName" . }}
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-proxy.datastores.secretName" . }}
                  key: minio-root-password
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            {{- toYaml .Values.datastores.minio.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            {{- toYaml .Values.datastores.minio.probes.liveness | nindent 12 }}
          resources:
            {{- toYaml .Values.datastores.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.datastores.minio.storageClass }}
        storageClassName: {{ .Values.datastores.minio.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.datastores.minio.storage | quote }}
{{- end -}}
