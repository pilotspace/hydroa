---
# Envoy production config — Hydroa Gateway (contract §3, edge-tls TASK.md v2)
#
# Production posture:
#   :8443 — TLS termination (real certs mounted via docker-compose.prod.yml volumes)
#   :8080 — HTTP redirect only → 301 to https://<host>:8443
#   :9901 — admin interface NOT exposed to host in production
#
# Filter chain order on :8443 (identical to envoy.yaml :8443):
#   1. local_ratelimit  — global 50 req/s token bucket
#   2. jwt_authn        — HS256 JWT validation for /admin/* prefix only
#   3. ext_authz        — HTTP authz call to /internal/authz for /v1/* only
#   4. router           — terminal
#
# HSTS: route_config.response_headers_to_add on :8443 route_config (same mechanism as
#   envoy.yaml :8443). Envoy v1.29 does NOT support response_headers_to_add on the
#   Listener or HCM proto — route_config level is the correct placement.
#
# ⚠ JWKS note: same GATEWAY_JWT_SECRET_BASE64URL placeholder substituted at startup
#   via the compose entrypoint (same sed pattern as e2e stack).
#
# ⚠ TLS certs: operator mounts real cert/key at container paths via compose volumes:
#     /etc/envoy/certs/server.crt  — TLS certificate chain
#     /etc/envoy/certs/server.key  — TLS private key
#   See docker-compose.prod.yml TLS_CERT_PATH / TLS_KEY_PATH env vars.
#
# Schema bootstrap (one-time, before first start):
#   make migrate   (runs: cd apps/gateway && uv run alembic upgrade head)
#   Requires GATEWAY_DATABASE_URL pointing at the production database.

static_resources:

  listeners:
    - name: listener_tls
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8443
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_2
                  # cipher_suites omitted — Envoy v1.29 TLS 1.2/1.3 modern defaults apply
                tls_certificates:
                  - certificate_chain:
                      filename: "/etc/envoy/certs/server.crt"
                    private_key:
                      filename: "/etc/envoy/certs/server.key"
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_https
                use_remote_address: true

                # WebSocket upgrade for /v1/realtime + /v1/realtime/relay (v52).
                upgrade_configs:
                  - upgrade_type: websocket

                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: local_rate_limiter
                      token_bucket:
                        max_tokens: 50
                        tokens_per_fill: 50
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-ratelimit-limit
                            value: "50"

                  - name: envoy.filters.http.jwt_authn
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                      providers:
                        gateway_jwt:
                          issuer: "ai-proxy"
                          local_jwks:
                            inline_string: >-
                              {"keys":[{"kty":"oct","alg":"HS256","use":"sig","k":"GATEWAY_JWT_SECRET_BASE64URL"}]}
                          forward: true
                          payload_in_metadata: "jwt_payload"
                      rules:
                        - match:
                            path: "/admin/auth/signup"
                        - match:
                            path: "/admin/auth/login"
                        - match:
                            prefix: "/admin/"
                          requires:
                            provider_name: "gateway_jwt"
                        - match:
                            prefix: "/"

                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      http_service:
                        server_uri:
                          uri: "http://gateway:8000"
                          cluster: "gateway_cluster"
                          timeout: 2s
                        path_prefix: "/internal/authz"
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: "authorization"
                              - exact: "x-api-key"
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: "x-tenant-id"
                              - exact: "x-key-id"
                      failure_mode_allow: false

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

                route_config:
                  name: tls_route
                  # HSTS at route_config level — applies to all responses including
                  # direct_response (403 /internal/*) and routed responses.
                  response_headers_to_add:
                    - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      header:
                        key: Strict-Transport-Security
                        value: "max-age=63072000; includeSubDomains"
                  virtual_hosts:
                    - name: local
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/internal/"
                          direct_response:
                            status: 403
                            body:
                              inline_string: "Forbidden"
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: gateway_cluster
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              check_settings:
                                context_extensions:
                                  route: "v1"

                        - match:
                            prefix: "/admin/"
                          route:
                            cluster: gateway_cluster
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

                        - match:
                            prefix: "/"
                          route:
                            cluster: gateway_cluster
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true

    # ── HTTP :8080 redirect-only listener (production) ───────────────────────────
    # Redirects all plain HTTP traffic to HTTPS :8443 with 301.
    - name: listener_http_redirect
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http_redirect
                use_remote_address: true
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: redirect_route
                  virtual_hosts:
                    - name: redirect
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          redirect:
                            https_redirect: true
                            port_redirect: 8443

  clusters:
    - name: gateway_cluster
      connect_timeout: 0.5s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: gateway_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: gateway
                      port_value: 8000
