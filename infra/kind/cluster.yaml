# kind cluster for the ai-proxy stack  ·  v53 task 6 kind-bootstrap
#
# A single control-plane node. The Envoy edge is exposed to the host via a fixed NodePort
# (30443, pinned by infra/kind/edge-nodeport.yaml) mapped to host :8443 — so the host e2e
# (tasks 7–9) and `make kind-smoke` can reach https://127.0.0.1:8443 without a port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      # host 8443 -> node NodePort 30443 (the edge-nodeport Service) -> envoy :8443 (https)
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
