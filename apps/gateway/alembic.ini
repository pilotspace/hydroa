# alembic.ini — Alembic configuration for the gateway service.
# GATEWAY_DATABASE_URL env var overrides sqlalchemy.url at runtime (env.py).
# Never commit real credentials here; this file is safe for version control.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder URL — overridden by GATEWAY_DATABASE_URL in migrations/env.py.
# For local dev, set GATEWAY_DATABASE_URL or update this value; never hard-code
# production credentials here.
sqlalchemy.url = postgresql+asyncpg://gateway:gateway@localhost:5433/gateway_test

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
