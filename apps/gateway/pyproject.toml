[project]
name = "gateway"
version = "0.1.0"
description = "AI proxy gateway: OpenAI-compatible data plane + admin control plane over OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "redis>=5",
    "alembic>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen test files have pre-existing format issues; excluding them from format
# checks avoids violating the "never edit test files" contract.
# - tests/edge: frozen by edge-envoy TASK.md §4
# - tests/migrations: frozen by db-migrations TASK.md §4
exclude = [
    "tests/edge/test_authz_bearer.py",
    "tests/edge/test_e2e_edge.py",
    "tests/migrations/conftest.py",
    "tests/migrations/test_migrations.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests; src is mypy-strict anyway

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "RUF002", "RUF003", "E501", "F401", "F541"]  # fixture secrets/token literals + unicode chars are test data, not leaks; F401 for inline test imports; F541 for f-strings in frozen test assertions
"migrations/**" = ["F401", "RUF100"]  # Alembic env.py uses intentional side-effect imports; migration versions use legacy Union/Sequence typing from mako template
"tests/migrations/**" = ["PLC0415", "ARG001", "RUF100", "RUF043"]  # frozen test files: intentional late imports (PLC0415), unused fixture args (ARG001), regex string in pytest.raises match= (RUF043)

[tool.mypy]
strict = true
packages = ["gateway"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring the infra/docker-compose.e2e.yml stack (excluded by default)",
]
addopts = "--cov=gateway --cov-report=term-missing --cov-fail-under=80 -m 'not e2e'"

[tool.coverage.run]
source = ["src/gateway"]
