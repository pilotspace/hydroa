[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests; src is mypy-strict anyway

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S110", "RUF002", "RUF003", "E501", "F401", "F541", "F841", "RUF059", "RUF100", "I001"]  # fixture secrets/token literals + unicode chars are test data, not leaks; F401 for inline test imports; F541 for f-strings in frozen test assertions; F841/RUF059 for intentional unused variables in frozen test files; RUF100 for noqa directives in frozen test files that reference rules not in the enabled set; I001 for deferred/local imports inside test helper functions; S110 for frozen test try/except/pass patterns
"migrations/**" = ["F401", "RUF100"]  # Alembic env.py uses intentional side-effect imports; migration versions use legacy Union/Sequence typing from mako template
"src/gateway/usage/api/router.py" = ["S608"]  # granularity validated against whitelist; key_filter is hardcoded literal — no injection risk
"src/gateway/guardrail_analytics/api/router.py" = ["S608"]  # granularity/group_by validated against whitelists; key_filter is hardcoded literal — no injection risk (mirrors usage/api/router.py)
"src/gateway/alerting/application/dispatcher.py" = ["S608"]  # _UNDELIVERED_WHERE is a module-level constant interpolated into text(); the only variable part is the BOUND parameter :meta_key — no caller input reaches the SQL (same shape as usage/api/router.py)
"tests/migrations/**" = ["PLC0415", "ARG001", "RUF100", "RUF043"]  # frozen test files: intentional late imports (PLC0415), unused fixture args (ARG001), regex string in pytest.raises match= (RUF043)

[tool.pyright]
include = ["src/gateway"]
extraPaths = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
# Replaces mypy --strict (2026-06-12). Strict mode retained for its real checks
# (unused imports/functions, attribute-access, argument-type), but the
# reportUnknown* family is disabled: it flags partially-unknown types at untyped
# third-party boundaries (Redis, raw dict parsing) that mypy --strict never
# enforced — keeping it on would mean 122 errors of churn unrelated to behavior.
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
# python3-saml (saml-sso task) ships no py.typed marker / .pyi stubs — same
# "untyped third-party boundary" class as Redis above; without this the SAML
# assertion-validation vertical would carry 7+ reportMissingTypeStubs errors
# unrelated to behavior for every onelogin.saml2.* import.
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# suite-stability M8 — a hang must be LOUD. Without this a stalled test simply
# stops the run: on 2026-07-26 a leaked app lifespan parked a worker for 10h23m
# and printed nothing naming the test. `timeout` fails the overrunning test with
# a stack instead. 300 s is ~4x the slowest legitimate test observed (realtime,
# ~98 s for the whole module). method=signal, verified rather than assumed: it
# interrupts the exact frame the real hang sat in (selectors.py `_selector.control`,
# i.e. kevent) and lets the REST of the session continue. timeout_method=thread was
# tried first and rejected — it kills the whole worker process, losing every
# remaining test on that node to punish one slow one.
# Pinned by tests/repo_hygiene/test_repo_hygiene.py::test_hang_tripwire_is_armed.
timeout = 300
timeout_method = "signal"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring the infra/docker-compose.e2e.yml stack (excluded by default)",
    "kind_e2e: live e2e against a kind cluster — run via `make kind-e2e` (excluded by default)",
    "integration: tests requiring real Postgres (localhost:5433) and/or Redis (localhost:6380)",
]
addopts = "--cov=gateway --cov-report=term-missing --cov-fail-under=80 -m 'not e2e and not kind_e2e'"

[tool.coverage.run]
source = ["src/gateway"]
concurrency = ["greenlet"]
