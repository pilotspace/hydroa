[project]
name = "hydroa-gateway"
version = "0.14.1"
description = "Hydroa gateway: OpenAI-compatible data plane + admin control plane over OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=25.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "asyncpg>=0.31.0",
    "pyjwt>=2.13.0",
    "argon2-cffi>=25.1.0",
    "redis>=5",
    "alembic>=1.9",
    "prometheus-client>=0.21",
    "cryptography>=48.0.1",
    "tenacity>=8.2",
    "python-multipart>=0.0.32",
    "tinytag>=2.2,<3",
    "aioboto3>=13",
    "jsonschema>=4.23,<5",
    "python3-saml>=1.16.0",
    "dnspython>=2.8.0",
    "reportlab>=4.2",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pytest-rerunfailures>=14.0",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
