name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Stop superseded runs from starving live ones. One run is 5 jobs (4 shards + dashboard) and
# the Free plan cap is 5 CONCURRENT jobs for the whole account, so TWO runs do not overlap at
# all — they serialize. Observed 2026-08-11: main's push run for 9279c51 sat `queued` behind
# PR #102's run. Without this block, every re-push to a PR branch left the previous run's 5
# jobs running to completion while the new one waited ~13 min for a slot.
#
# `cancel-in-progress` is deliberately an EXPRESSION, not `true`. A main run must NEVER be
# cancelled: it is the release-integrity record, and a cancelled check reaches no verdict —
# the exact fault this milestone exists to close, and how three earlier runs "proved" nothing.
# Guarded by tests/migrations/test_ci_workflow_parity.py, so simplifying this to a bare
# `true` is a red test rather than a silent loss.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gateway:
    runs-on: ubuntu-latest
    # SHARDED 2026-08-11. The suite is split across 4 runners, each with its OWN Postgres and
    # Redis, cutting wall-clock from 65-82 min to roughly 13. The lever is BOXES, not
    # workers: `-n 4` on one runner bought almost nothing because its 4 vCPUs are shared with
    # the service containers, every worker carries a ~1.92x coverage multiplier, and all four
    # contend on ONE database (measured, todo #96 / #100).
    #
    # Newly affordable because the repo went PUBLIC: GitHub Actions is unmetered for public
    # repositories, so the concurrent runners cost nothing where they were previously
    # competing for the metered minutes that were fault 1 of this whole milestone. Note that
    # "free" is not "unlimited" — the Free plan still caps CONCURRENT jobs, which is what
    # actually sets the shard count below.
    #
    # The cheap gates (lint, typecheck, allowlists, migrate-parity — 32s + ~40s combined) run
    # in EVERY shard rather than once in a separate job. That is deliberate: they cost no
    # wall-clock because the shards are parallel, and keeping them here means the job-scoped
    # parity guards in tests/migrations/test_ci_workflow_parity.py continue to check the job
    # that actually holds the services. Redundancy in a cheap gate is not waste; a gate
    # relocated out from under its guard is how gates go quietly missing.
    strategy:
      # NEVER fail-fast. Cancelling sibling shards on the first failure destroys exactly the
      # information a flake investigation needs — which OTHER shards were also red, and
      # whether the failure reproduces elsewhere. This suite has a live flake tail
      # (todos #105/#111); a partial picture is what made it take 7 attempts to characterise.
      fail-fast: false
      # FOUR, and the number is set by the CONCURRENCY CAP, not by the suite size.
      #
      # This org is on the Free plan, where the observed cap is 5 concurrent jobs. Measured on
      # run 31467111114: exactly 5 jobs `in_progress` with `gateway (5)` `queued`, and
      # `gateway (3)` starting at 07:01:45 — two seconds after `dashboard` completed at
      # 07:01:43. That is a freed slot, not a coincidence.
      #
      # So `dashboard` permanently occupies one of the 5 slots and only 4 gateway shards can
      # start immediately. A 5th or 6th shard does not run in parallel; it QUEUES behind a
      # shard and lands in a second wave, which costs a whole extra shard-duration. More
      # shards is therefore SLOWER here past 4 — the counter-intuitive part, and the reason
      # this is 4 rather than "as many as possible".
      #
      # MEASURED per-shard from run 31467111114 at N=6 (all six passed their tests; the run
      # was red only on the hidden-file upload bug fixed below):
      #   shard 1: 762 tests, 5m14s test / 6m05s job
      #   shard 2: 770 tests, 6m53s test / 7m53s job
      #   shard 4: 767 tests, 6m06s test / 7m01s job
      #   shard 6: 762 tests, 6m30s test / 7m29s job
      # Total test work ~38 min across shards, vs 65-82 min on ONE runner — sharding also
      # cuts total work, because 4 xdist workers no longer contend on a single Postgres.
      #
      # Projected from those numbers (~38 min of work / N, plus ~110s of fixed per-shard
      # setup, plus a ~2 min coverage job):
      #   N=4 -> 5 jobs, NOTHING queues, ~13 min   <-- chosen
      #   N=5 -> 6 jobs, one waits ~3 min,  ~14 min
      #   N=6 -> 7 jobs, one waits ~8 min,  ~18 min
      #
      # Revisit if the cap changes (a paid plan lifts it) or the suite grows enough that a
      # shard exceeds ~10 min. The `SHARDS` env below MUST equal this list's length —
      # guarded by test_the_shard_count_matches_the_matrix_exactly, because the drift is
      # silent in the direction that skips tests.
      matrix:
        shard: [1, 2, 3, 4]
    # MEASURED, and RE-measured after sharding. This is now a SHARD's budget, not the whole
    # suite's — run 31468024262 (N=4, all green) job durations:
    #   gateway (1) 9m37s   gateway (2) 9m23s   gateway (3) 9m34s   gateway (4) 9m56s
    # Longest 9m56s; 20 is that x ~2.
    #
    # Why x2 and not the x1.5 used for the old whole-suite cap: this suite has shown ~24%
    # run-to-run variance on identical work, and a cap set too LOW is not a conservative
    # choice — it converts a passing run into a `cancelled` one that proves nothing. x1.5
    # (15 min) is the guard FLOOR, so the cap can be tuned down to there on evidence without
    # touching the guard.
    #
    # It was 120, sized against the whole 82-min suite, which left a HUNG shard burning two
    # hours before reporting — defeating the fast feedback sharding just bought (todo #112).
    # History, all lower bounds because none of these ever completed:
    #   30 cap -> cancelled ~30m     (serial; every run on main from 2026-07-23)
    #   75 cap -> cancelled 74m17s   (serial; run 31197251730)
    #   60 cap -> cancelled 59m27s   (-n 4;   run 31241464171)
    #  120 cap -> the first caps that actually held; suite ran 1h06m-1h22m unsharded
    #
    # Do NOT try to win time back by raising -n. Measured: -n 4 bought almost
    # nothing over serial, because this runner's 4 vCPUs are shared with the
    # Postgres and Redis service containers, every worker carries coverage
    # instrumentation (a ~1.92x wall-clock multiplier, re-measured under todo #100;
    # an earlier note here said "+64%" and was wrong), and all four contend on ONE
    # database. More workers on one box is a dead end; more BOXES (matrix shards
    # with a DB each) or a bigger runner is the real lever — which is what the
    # `strategy.matrix` above now does. See todo #96.
    # Floor guarded by tests/migrations/test_ci_workflow_parity.py.
    timeout-minutes: 20
    services:
      postgres:
        # MUST match infra/docker-compose.{dev,e2e,prod}.yml and
        # charts/ai-proxy/values.yaml — the suite runs `CREATE EXTENSION vector`
        # (tests/conftest.py) and the ORM carries a Vector(1536) column, so a
        # stock/alpine Postgres fails the whole vector-store surface.
        # Guarded by tests/migrations/test_ci_workflow_parity.py.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # PATCH-pinned, and it must stay that way. "3.12" resolved to 3.12.3 here
          # while dev ran 3.12.13, and `ipaddress`'s special-purpose network lists
          # changed in between (CVE-2024-4032) — which the egress SSRF policy reads,
          # so the same code reached different verdicts on the two interpreters.
          # Must equal apps/gateway/.python-version; guarded by
          # tests/migrations/test_ci_workflow_parity.py.
          python-version: "3.12.13"
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Dependency allowlist gate
        run: make allowlist
      - name: Node dependency allowlist gate
        # `make ci` = lint typecheck allowlist allowlist-node test; this workflow
        # must enforce the SAME set. Guarded by
        # tests/migrations/test_ci_workflow_parity.py::test_ci_enforces_every_make_ci_gate.
        run: make allowlist-node
      - name: Migration parity gate
        # Delegates to `make migrate-parity` — the same target `make ci` runs — so a local
        # green and a CI green mean the same thing. This step used to inline the shell,
        # which made it CI-only: `make ci` never ran it, and 16 unregistered ORM modules
        # sat behind that gap until the first fully-green suite run exposed them.
        # alembic check is only valid on a DB at head, so the target uses a fresh scratch
        # DB, never gateway_test (the test run leaves an unstamped create_all schema there).
        #
        # ORDERED BEFORE the tests, deliberately. It used to sit after them, which meant a
        # single failing test skipped it and the parity verdict was never reached — the same
        # never-reaches-a-verdict shape that let those 16 modules hide in the first place
        # (observed again on PR #102: "Migration parity gate: skipped"). It costs ~40s, so
        # running it first is free and it now always produces an answer.
        run: make migrate-parity
      - name: Tests
        # ONE shard of the suite. Identical pytest invocation to `make test-ci`
        # (`-n 4 --dist loadscope`, no --reruns) so sharding is the only variable;
        # tests/_shard.py does a deterministic FILE-level split balanced by test count.
        #
        # Verified by exhaustive union at N=6: the union of all shards was EXACTLY the 4601
        # collected tests — 0 duplicates, 0 missing — with 761-772 tests per shard
        # (max/min = 1.014). The property is N-independent and is asserted for several N by
        # tests/repo_hygiene/test_shard_partition.py, because a sharding bug drops tests and
        # a shard that tested less than it should STILL EXITS 0.
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: make test-ci-shard SHARD="$SHARD" SHARDS="$SHARDS"
      - name: Upload shard coverage
        # Per-shard coverage data; the `coverage` job combines these and enforces the real
        # 80% gate across the WHOLE suite. Each shard alone covers only its own slice, so the
        # per-shard threshold is disabled in the Makefile target — the gate is not weakened,
        # it is relocated to the only place it can be correctly evaluated.
        # `if: always()` so a failing shard still contributes its data.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: apps/gateway/.coverage.shard${{ matrix.shard }}
          # REQUIRED, and it cost a full red run to learn: coverage data files start with a
          # dot, and upload-artifact v4 silently EXCLUDES hidden files by default. Every
          # shard passed its tests and then died here with "No files were found with the
          # provided path" — the file was written exactly where asked, just unmatched.
          include-hidden-files: true
          # `error`, not the default `warn`. With `warn` this misconfiguration would have
          # uploaded nothing, the coverage job would have combined nothing, and the 80% gate
          # would have reported green having measured zero lines. That is the never-reaches-
          # a-verdict shape (todos #107/#108/#109) — so both this and the empty-combine
          # guard in `make coverage-combine` are deliberate belt-and-braces.
          if-no-files-found: error
          retention-days: 1

  coverage:
    # The 80% coverage gate, evaluated on the COMBINED data from every shard. This job is
    # where `--cov-fail-under=80` actually lives now; the shards deliberately skip it because
    # each one only exercises its own slice of the code.
    #
    # `needs: gateway` means every shard must succeed first, so a red shard skips this job and
    # the `ci` gate below then fails — a shard failure can never be laundered into a green.
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
      - name: Install
        run: make install
      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: apps/gateway
      - name: Combine and enforce the 80% gate
        # `make coverage-combine` fails loudly when no shard data is present, rather than
        # "passing" the coverage gate having measured nothing.
        run: make coverage-combine

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        # `npm run lint` = `eslint .`, declared in package.json since the dashboard
        # existed but never actually RUN by anything. Next 15 and earlier ran ESLint as
        # part of `next build`, so the Build step below covered it silently; Next 16
        # REMOVED that, and the gate went dark at the Next 16 upgrade (#3) with nothing
        # reporting the change. When first executed on 2026-08-11 it was red with 5
        # errors — 4 of them one real defect (refs written during render in
        # useVerifyPoll). A declared check that nothing invokes reports green forever;
        # see todo #107.
        run: npm run lint
      - name: Test
        run: npx vitest run
      - name: Build
        # NOTE: this DOES still typecheck TypeScript — next.config.ts sets neither
        # `typescript.ignoreBuildErrors` nor `eslint.ignoreDuringBuilds`. It is only
        # the ESLint half that Next 16 dropped, which is why Lint is now its own step.
        run: npx next build

  ci:
    # THE single required status check. Branch protection points at this one context instead of
    # at `gateway`, because a matrix turns `gateway` into six contexts named `gateway (1)`…
    # `gateway (6)` — and a required-context list that has to be re-edited every time the shard
    # count changes is a list that will eventually be wrong. Wrong in the dangerous direction:
    # a shard nobody required is a shard whose failure blocks nothing.
    #
    # `if: always()` plus an EXPLICIT result check, not a bare `needs:`. With a bare `needs:`
    # this job would be SKIPPED when a dependency fails, and a skipped required check is not a
    # failing one — the merge would sit "expected" forever or, worse, be treated as neutral.
    # So it always runs and asserts each result is exactly "success"; anything else — failure,
    # cancelled, or skipped — is a red gate.
    if: always()
    needs: [gateway, coverage, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every gate to have passed
        env:
          GATEWAY: ${{ needs.gateway.result }}
          COVERAGE: ${{ needs.coverage.result }}
          DASHBOARD: ${{ needs.dashboard.result }}
        run: |
          echo "gateway=$GATEWAY coverage=$COVERAGE dashboard=$DASHBOARD"
          failed=0
          for pair in "gateway:$GATEWAY" "coverage:$COVERAGE" "dashboard:$DASHBOARD"; do
            name=${pair%%:*}; result=${pair#*:}
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result=$result)"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "all required gates passed"
