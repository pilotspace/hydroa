name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    # ⚠ 180 is an INSTRUMENT, not a target. Do not read it as the intended budget.
    #
    # Three runs have been cancelled without the suite ever finishing, so its true
    # wall-clock is still unknown — every figure below is a LOWER bound:
    #   30  cap -> cancelled ~30m      (serial;  every run on main from 2026-07-23)
    #   75  cap -> cancelled 74m17s    (serial;  run 31197251730)
    #   60  cap -> cancelled 59m27s    (-n 4;    run 31241464171)
    # Steps 1-9 cost 32s combined, so the budget is essentially all test time.
    #
    # Guessing the cap three times cost ~3.5h of metered minutes and taught nothing.
    # This run exists to MEASURE: let it finish once, then set the real cap from the
    # observed number (~1.5x) and raise MIN_GATEWAY_TIMEOUT_MINUTES to match.
    # Tracked by todo #95 — 180 must not survive as the standing value.
    # Floor guarded by tests/migrations/test_ci_workflow_parity.py.
    timeout-minutes: 180
    services:
      postgres:
        # MUST match infra/docker-compose.{dev,e2e,prod}.yml and
        # charts/ai-proxy/values.yaml — the suite runs `CREATE EXTENSION vector`
        # (tests/conftest.py) and the ORM carries a Vector(1536) column, so a
        # stock/alpine Postgres fails the whole vector-store surface.
        # Guarded by tests/migrations/test_ci_workflow_parity.py.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Dependency allowlist gate
        run: make allowlist
      - name: Node dependency allowlist gate
        # `make ci` = lint typecheck allowlist allowlist-node test; this workflow
        # must enforce the SAME set. Guarded by
        # tests/migrations/test_ci_workflow_parity.py::test_ci_enforces_every_make_ci_gate.
        run: make allowlist-node
      - name: Tests
        # `make test-ci` — the same suite as `make test`, fanned across 4 xdist
        # workers to match this runner's cores, with no --reruns so the gate stays
        # strict. Serial needed >74 min here and was cancelled mid-run. See the
        # Makefile's test-ci comment for the full reasoning.
        run: make test-ci
      - name: Migration parity gate
        # alembic check is only valid on a DB at head (contract §1) — use a fresh
        # scratch DB, never gateway_test (the test run leaves an unstamped
        # create_all schema there).
        run: |
          PGPASSWORD=gateway psql -h localhost -p 5433 -U gateway -d gateway_test \
            -c "DROP DATABASE IF EXISTS gateway_parity;" -c "CREATE DATABASE gateway_parity;"
          make migrate
          make migrate-check
        env:
          GATEWAY_DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost:5433/gateway_parity

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npx vitest run
      - name: Build
        run: npx next build
