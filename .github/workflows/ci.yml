name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway
          POSTGRES_DB: gateway_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Dependency allowlist gate
        run: make allowlist
      - name: Tests
        run: make test
